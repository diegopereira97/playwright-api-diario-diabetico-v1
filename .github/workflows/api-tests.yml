name: API Tests (Cucumber + Playwright)

on:
  workflow_dispatch:
  # TODO: reative o gatilho automático quando as APIs estiverem acessíveis no CI
  # (subindo como serviço neste workflow ou apontando para um ambiente remoto).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # TODO: caso as APIs "Serviço de Cadastro" e "Serviço de Glicose" tenham
    # imagens Docker, o jeito mais simples de rodar tudo no mesmo runner é
    # declará-las aqui como "services:" (equivalente a um docker-compose).
    # Exemplo:
    # services:
    #   api:
    #     image: sua-org/sua-api:latest
    #     ports:
    #       - 3000:3000

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      API_STARTUP_TIMEOUT_SECONDS: 120
      API_STARTUP_INTERVAL_SECONDS: 5
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # Persiste .cache/auth-token.json ENTRE execuções do workflow — sem
      # isso, todo run começa de um checkout limpo e é forçado a logar de
      # novo em /auth/login, gastando uma vaga do rate limit a CADA
      # execução, mesmo rodando o workflow várias vezes seguidas em pouco
      # tempo (foi exatamente isso que aconteceu enquanto depurávamos).
      # Como o token dura 7 dias, isso deixa o CI se comportando igual ao
      # ambiente local (que já reaproveita o cache em disco). Chave
      # sempre única + restore-keys é o padrão do GitHub Actions pra
      # simular "cache que sempre atualiza": todo run tenta restaurar o
      # mais recente disponível e salva uma versão nova ao final.
      # ⚠️ Só faça isso pra uma conta de TESTE dedicada — nunca cacheie
      # token de usuário real, e confirme que .cache/ está no .gitignore.
      - name: Cache do token de autenticação (usuário de teste)
        uses: actions/cache@v4
        with:
          path: .cache
          key: auth-token-cache-${{ github.run_id }}
          restore-keys: |
            auth-token-cache-

              
      - name: Diagnóstico do Cucumber
        run: |
          echo "=== NODE ==="
          node --version

          echo "=== NPM ==="
          npm --version

          echo "=== CUCUMBER ==="
          npx cucumber-js --version

          echo "=== FEATURES ==="
          find features -type f -name "*.feature" -print

          echo "=== STEPS ==="
          find src/steps -type f -name "*.ts" -print

          echo "=== SUPPORT ==="
          find src/support -type f -name "*.ts" -print

           - name: Aguardar API do Render sair do cold start
           run: npm run wait:api

            - name: Rodar testes de API (gera JSON + dados do Allure em uma única execução)
           run: |
              mkdir -p reports allure-results
              npx cucumber-js --profile ci

      - name: Publicar relatório de testes (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          retention-days: 15

      # --- Relatório Allure (opcional) ---
      # O Allure CLI precisa de Java, por isso o setup-java abaixo.
      # OBS: sem um passo extra para restaurar allure-report/history de uma
      # execução anterior (ex.: cache, ou publicando em uma branch/Pages
      # fixa), o gráfico de tendência entre execuções não persiste no CI —
      # cada run gera um relatório "zerado". Ajuste isso quando decidir onde
      # publicar o relatório de forma persistente.
      - name: Configurar Java (necessário para o Allure CLI)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar relatório Allure (HTML)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15
