name: API Tests (Cucumber + Playwright)

on:
  workflow_dispatch:
  # TODO: reative o gatilho automático quando as APIs estiverem acessíveis no CI
  # (subindo como serviço neste workflow ou apontando para um ambiente remoto).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      API_STARTUP_TIMEOUT_SECONDS: 120
      API_STARTUP_INTERVAL_SECONDS: 5
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Cache do token de autenticação (usuário de teste)
        uses: actions/cache@v4
        with:
          path: .cache
          key: auth-token-cache-${{ github.run_id }}
          restore-keys: |
            auth-token-cache-

      - name: Aguardar API do Render sair do cold start
        run: npm run wait:api

      # DEBUG TEMPORÁRIO: o job termina com "exit code 1" mesmo quando o
      # allure-report mostra 100% dos cenários passando — ou seja, o
      # processo do cucumber-js está saindo com código != 0 por algum
      # motivo QUE NÃO é teste falho (provavelmente algo assíncrono
      # rodando depois do relatório já ter sido escrito: um handle aberto,
      # uma promise rejeitada sem catch, um processo em background que não
      # terminou). O 2>&1 | tee grava TUDO (stdout+stderr) num arquivo,
      # publicado como artefato abaixo — assim a gente vê o texto completo
      # sem depender do visualizador de log do GitHub (que já cortou esse
      # trecho duas vezes). O "exit ${PIPESTATUS[0]}" é essencial: sem
      # isso, o "tee" mascara o código de saída real do cucumber-js e o
      # step SEMPRE passaria, escondendo falhas de verdade.
      - name: Rodar testes de API (gera JSON + dados do Allure em uma única execução)
        run: |
              mkdir -p reports allure-results
              npx cucumber-js --profile ci 2>&1 | tee cucumber-run-output.log
              exit ${PIPESTATUS[0]}

      - name: Publicar log bruto da execução (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-raw-log
          path: cucumber-run-output.log
          retention-days: 5

      - name: Publicar relatório de testes (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          retention-days: 15

      - name: Configurar Java (necessário para o Allure CLI)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar relatório Allure (HTML)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15
