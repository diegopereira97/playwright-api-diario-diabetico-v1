name: API Tests (Cucumber + Playwright)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      API_STARTUP_TIMEOUT_SECONDS: 120
      API_STARTUP_INTERVAL_SECONDS: 5
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Cache do token de autenticação (usuário de teste)
        uses: actions/cache@v4
        with:
          path: .cache
          key: auth-token-cache-${{ github.run_id }}
          restore-keys: |
            auth-token-cache-

      - name: Aguardar API do Render sair do cold start
        run: npm run wait:api

      # Removido o "| tee" que estava aqui: ele pode ter sido a própria
      # causa do log vir truncado/com exit code errado (escrita
      # assíncrona do Node cortada por process.exit(), possível EPIPE
      # ao encanar pra outro processo). Rodando puro, sem pipe nenhum, o
      # exit code que chega no shell é exatamente o que o cucumber-js
      # realmente retornou — sem intermediário nenhum pra distorcer isso.
      - name: Rodar testes de API (gera JSON + dados do Allure em uma única execução)
        run: |
              rm -rf reports allure-results
              mkdir -p reports allure-results
              npx cucumber-js --profile ci

      - name: Publicar relatório de testes (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          retention-days: 15

      - name: Configurar Java (necessário para o Allure CLI)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar relatório Allure (HTML)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15
