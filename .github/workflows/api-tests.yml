name: API Tests (Cucumber + Playwright)

on:
  workflow_dispatch:
  # TODO: reative o gatilho automático quando as APIs estiverem acessíveis no CI
  # (subindo como serviço neste workflow ou apontando para um ambiente remoto).
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      API_STARTUP_TIMEOUT_SECONDS: 120
      API_STARTUP_INTERVAL_SECONDS: 5
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Cache do token de autenticação (usuário de teste)
        uses: actions/cache@v4
        with:
          path: .cache
          key: auth-token-cache-${{ github.run_id }}
          restore-keys: |
            auth-token-cache-

      - name: Aguardar API do Render sair do cold start
        run: npm run wait:api

      # DEBUG: o job vinha terminando com "exit code 1" mesmo quando o
      # allure-report mostrava 100% dos cenários passando. Causa provável:
      # allure-results/ (e/ou reports/) commitados no Git com dados de uma
      # execução antiga — "allure generate ... --clean" só limpa a pasta
      # de SAÍDA (allure-report), não a de ENTRADA (allure-results). Sem o
      # rm -rf abaixo, todo checkout trazia de volta os arquivos antigos, e
      # o relatório final mostrava o resultado de uma run passada, mesmo
      # quando o cucumber-js da execução atual travava ou falhava de
      # verdade. O 2>&1 | tee + exit ${PIPESTATUS[0]} continuam aqui pra
      # garantir a saída completa em log e o código de saída real.
      - name: Rodar testes de API (gera JSON + dados do Allure em uma única execução)
        run: |
              rm -rf reports allure-results
              mkdir -p reports allure-results
              npx cucumber-js --profile ci 2>&1 | tee cucumber-run-output.log
              exit ${PIPESTATUS[0]}

      - name: Publicar log bruto da execução (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-raw-log
          path: cucumber-run-output.log
          retention-days: 5

      - name: Publicar relatório de testes (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.json
          retention-days: 15

      - name: Configurar Java (necessário para o Allure CLI)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar relatório Allure (HTML)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 15
